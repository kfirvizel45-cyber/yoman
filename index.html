<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>יומן חכם</title>
<meta name="theme-color" content="#0E0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן חכם">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <button class="ib back" id="backBtn" type="button" aria-label="חזרה לחודש" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ttl" id="ttlBtn" type="button"><span id="ttl">אוקטובר</span><svg class="caret" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg></button>
    <span class="grow"></span>
    <span class="demo" id="demoPill" hidden>הדגמה</span>
    <button class="ib todayic" id="todayBtn" type="button" aria-label="היום"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/></svg><b id="todayNum"></b></button>
    <button class="ib" id="setBtn" type="button" aria-label="הגדרות"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <div class="months" id="months" hidden></div>
  <div class="banner" id="banner" hidden></div>

  <main>
    <section id="view-month" class="view">
      <div class="nextvac" id="nextvac"></div>
      <div class="wkhead" id="wkhead"></div>
      <div class="mgrid" id="mgrid"></div>
    </section>

    <section id="view-day" class="view" hidden>
      <div class="dhead" id="dhead"></div>
      <div class="dweek" id="dweek"></div>
      <div class="dcards" id="dcards"></div>
      <h3 class="h" id="dlistH"></h3>
      <div class="dlist" id="dlist"></div>
      <h3 class="h" id="dsoonH" hidden>מתקרב</h3>
      <div class="soon" id="dsoon"></div>
    </section>

    <section id="view-tasks" class="view" hidden>
      <div class="list" id="tasksList"></div>
      <div class="list-h" id="doneHead" hidden></div>
      <div class="list" id="doneList"></div>
    </section>

    <section id="view-vac" class="view" hidden></section>

    <section id="view-settings" class="view" hidden></section>
  </main>
</div>

<div class="dock" id="dock"><div>
  <button class="say" id="fab" type="button" aria-label="הוספה"><span>מה יש לך? כתוב או הכתב</span><i>+</i></button>
  <nav class="tabs" id="tabs">
    <button type="button" data-view="day">היום</button>
    <button type="button" data-view="month">חודש</button>
    <button type="button" data-view="tasks">מבחנים<i class="badge" id="tasksBadge" hidden></i></button>
    <button type="button" data-view="vac">חופשות</button>
  </nav>
</div></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
